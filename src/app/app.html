<main dir="rtl">
  <h1>وصف المنتج</h1>
  <!-- Slide 3: form fields replace the fixed example data. -->
  <label>
    اسم المنتج
    <input
      type="text"
      [value]="productName()"
      (input)="updateProductName($event)"
    />
  </label>
  <label>
    المواصفات
    <textarea
      rows="5"
      [value]="specifications()"
      (input)="updateSpecifications($event)"
    ></textarea>
  </label>
  <p>وصف تجريبي بدون اتصال بالذكاء الاصطناعي.</p>
  <button type="button" (click)="generate()" [disabled]="isGenerating()">
    {{ isGenerating() ? 'جاري التوليد…' : 'ولّد الوصف' }}
  </button>
  <p role="status">{{ description() }}</p>
  @if (wordCount() !== null) {
    <p>عدد الكلمات: {{ wordCount() }} / 100</p>
    <p>{{ wordCount()! <= 100 ? 'الوصف ضمن الحد المطلوب.' : 'الوصف محتاج اختصار.' }}</p>
  }
  @if (error()) {
    <p role="alert">{{ error() }}</p>
  }
</main>
